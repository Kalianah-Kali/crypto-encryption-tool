<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="../static/css/server_result_style.css">
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
	<title>TpyrKc4h</title>
</head>
<body>
	<h1>TpyrKc4h</h1>
	<p class="title_description">Here's the result of the operation</p>
	<div class="general_div">

		<textarea id="cipher" name="text_string" readonly>{{result}}</textarea>
		<button class="copybtn" id="CopyBtn" type="button">Copy</button>
		
	</div>
	<form method="POST" action="/shipper">
		<input type="submit" name="back" value="Back">
	</form>
	<script>
		// Fonction pour copier le contenu du textarea
		function copyTextarea() {
			const textarea = document.getElementById("cipher");
			if (textarea) {
				navigator.clipboard.writeText(textarea.value).then(() => {
					// Change le texte du bouton
					const btn = document.getElementById("CopyBtn");
					btn.textContent = "Copied ✓";

					// Retourne à "Copy" après 1.5s
					setTimeout(() => {
						btn.textContent = "Copy";
					}, 500);
				}).catch(err => {
					alert("Copy failed: " + err);
				});
			}
		}

		// Ajoute l'événement au bouton
		document.getElementById("CopyBtn").addEventListener("click", copyTextarea);
	</script>

</body>
</html>
