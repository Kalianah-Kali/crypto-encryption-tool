<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="../static/css/key_generator_style.css">
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
	<title></title>
</head>
<body>
	<h1>TpyrKc4h</h1>
	<p class="advice">Click on the button generate to obtain your completely random key.Alternatively, you can obtain your key from your interlocutor</p>
	<div class="general_div">
		<form method="POST" action="/generating">
			<input type="text" name="public_key" placeholder="public key" value="{{public_key}}" id="public">
			<button class="copy-btn" type="button" id="copy_1">Copy</button>
			<input type="text" name="private_key" placeholder="private key" value="{{private_key}}" id="private">
			<button class="copy-btn" type="button" id="copy_2">Copy</button>
			<input type="text" name="e_key" placeholder="partial key" value="{{partial_key}}" id="partial">
			<button class="copy-btn" type="button" id="copy_3">Copy</button>
			<input type="submit" name="key_generator" value="Generate">
		</form>
		<form method="POST" action="/home">
			<input type="submit" name="back" value="Back">
		</form>
	</div>
	<script>
		function copyTextarea_public() {
			const textarea = document.getElementById("public");
			if (textarea) {
				navigator.clipboard.writeText(textarea.value).then(() => {
					// Change le texte du bouton
					const btn = document.getElementById("copy_1");
					btn.textContent = "Copied ✓";

					// Retourne à "Copy" après 1.5s
					setTimeout(() => {
						btn.textContent = "Copy";
					}, 500);
				}).catch(err => {
					alert("Copy failed: " + err);
				});
			}
		}

		function copyTextarea_private()	{
			const textarea = document.getElementById("private");
			if (textarea) {
				navigator.clipboard.writeText(textarea.value).then(() => {
					// Change le texte du bouton
					const btn = document.getElementById("copy_2");
					btn.textContent = "Copied ✓";

					setTimeout(() => {
						btn.textContent = "Copy";
					}, 500);
				}).catch(err => {
					alert("Copy failed: " + err);
				});
			}
		}

		function copyTextarea_partial() {
			const textarea = document.getElementById("partial");
			if (textarea) {
				navigator.clipboard.writeText(textarea.value).then(() => {
					const btn = document.getElementById("copy_3");
					btn.textContent = "Copied ✓";

					setTimeout(() => {
						btn.textContent = "Copy";
					}, 500);
				}).catch(err=> {
					alert("Copy failed: " + err);
				});
			}
		}

		document.getElementById("copy_1").addEventListener("click", copyTextarea_public);
		document.getElementById("copy_2").addEventListener("click", copyTextarea_private);
		document.getElementById("copy_3").addEventListener("click", copyTextarea_partial);
	</script>
</body>
</html>
