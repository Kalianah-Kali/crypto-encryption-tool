<!DOCTYPE html>
<head>
	<title>TpyrKc4h</title>
	<meta charset="utf-8">
	<link rel="stylesheet" type="text/css" href="../static/css/server_index_style.css">
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
	<h1>TpyrKc4h</h1>
	<p class="title_description">Encrypt / Decrypt — secure RSA tool ||| customer interface</p>
	<form method="POST" action="/shipper_result">
		<div class="general_div">
			<label for="cipher" class="first_label">Text to be encrypted/decrypted</label>
			<textarea id="cipher" name="text_string" placeholder="Paste your text here strings, numeric, alphanumeric">{{result}}</textarea>
			
			<p style="margin-left: 148px;">Keys below ↓</p>
			
			<input  class="private_key" id="privateKey" type="text" name="private_key" placeholder="private key" autocomplete="off">
			<button class="copybtn" type="button" id="copyPrivate">Copy</button>
			
			<input class="public_key" id="publicKey" type="text" name="public_key" placeholder="public key" autocomplete="off">
			<button class="copybtn" type="button" id="copyPublic">Copy</button>
			
			<input class="send" type="submit" value="E/D Crypt">
		</div>
	</form>
	<form method="POST" action="/home">
		<input type="submit" name="back" value="Home">
	</form>

	<script>
		// Fonction générique pour copier le contenu d'un input
		function copyToClipboard(inputId, buttonElement) {
			const input = document.getElementById(inputId);
			if (input) {
				navigator.clipboard.writeText(input.value).then(() => {
					buttonElement.textContent = "Copied ✓";
					setTimeout(() => buttonElement.textContent = "Copy", 1500);
				}).catch(err => {
					alert("Copy failed: " + err);
				});
			}
		}

		// Bouton pour la clé privée
		document.getElementById("copyPrivate").addEventListener("click", function() {
			copyToClipboard("privateKey", this);
		});

		// Bouton pour la clé publique
		document.getElementById("copyPublic").addEventListener("click", function() {
			copyToClipboard("publicKey", this);
		});
	</script>
</body>
</html>
